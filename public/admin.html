<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Админка мессенджера</title>
<link rel="stylesheet" href="/style.css">
<style>
  .admin-wrap { max-width: 680px; margin: 40px auto; padding: 0 20px; }
  .card { background: var(--panel); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
  .card h2 { margin-top: 0; font-size: 17px; }
  .card input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); margin-bottom: 10px; }
  .card button { padding: 10px 18px; border-radius: 8px; border: none; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  .code-box { font-size: 22px; letter-spacing: 2px; background: var(--panel-2); padding: 14px; border-radius: 10px; text-align: center; margin-top: 12px; font-weight: 700; }
  .hint { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  .tag-used { color: var(--text-dim); }
  .tag-free { color: #6cd07a; }
</style>
</head>
<body>
<div class="admin-wrap">
  <div id="loginCard" class="card">
    <h2>Вход в админку</h2>
    <input id="adminPassword" type="password" placeholder="Пароль администратора (ADMIN_PASSWORD)">
    <button id="adminLoginBtn">Войти</button>
    <div class="hint" id="loginError" style="color:#f27878"></div>
  </div>

  <div id="panel" class="card hidden">
    <h2>Создать приглашение</h2>
    <button id="genBtn">Сгенерировать новый код</button>
    <div id="newCodeBox" class="code-box hidden"></div>
    <div class="hint">Код показывается один раз. Отправь его человеку в личку — он введёт его при первом входе вместе со своей почтой.</div>
  </div>

  <div id="listsCard" class="card hidden">
    <h2>Коды приглашений</h2>
    <table id="invitesTable"><thead><tr><th>Код</th><th>Статус</th><th>Кем использован</th></tr></thead><tbody></tbody></table>
  </div>

  <div id="usersCard" class="card hidden">
    <h2>Пользователи</h2>
    <table id="usersTable"><thead><tr><th>Имя</th><th>Почта</th></tr></thead><tbody></tbody></table>
  </div>
</div>

<script>
  let token = localStorage.getItem('adminToken') || null;

  async function api(path, options = {}) {
    const res = await fetch('/api' + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Ошибка');
    return data;
  }

  document.getElementById('adminLoginBtn').addEventListener('click', async () => {
    try {
      const data = await api('/admin/login', { method: 'POST', body: { password: document.getElementById('adminPassword').value } });
      token = data.token;
      localStorage.setItem('adminToken', token);
      showPanel();
    } catch (e) {
      document.getElementById('loginError').textContent = e.message;
    }
  });

  document.getElementById('genBtn').addEventListener('click', async () => {
    const data = await api('/admin/invites', { method: 'POST' });
    const box = document.getElementById('newCodeBox');
    box.textContent = data.code;
    box.classList.remove('hidden');
    loadInvites();
  });

  async function loadInvites() {
    const data = await api('/admin/invites');
    const tbody = document.querySelector('#invitesTable tbody');
    tbody.innerHTML = '';
    data.invites.slice().reverse().forEach(inv => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${inv.codePreview}</td><td class="${inv.used ? 'tag-used' : 'tag-free'}">${inv.used ? 'использован' : 'свободен'}</td><td>${inv.usedByEmail || '—'}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('listsCard').classList.remove('hidden');
  }

  async function loadUsers() {
    const data = await api('/admin/users');
    const tbody = document.querySelector('#usersTable tbody');
    tbody.innerHTML = '';
    data.users.forEach(u => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${u.name}</td><td>${u.email}</td>`;
      tbody.appendChild(tr);
    });
    document.getElementById('usersCard').classList.remove('hidden');
  }

  function showPanel() {
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('panel').classList.remove('hidden');
    loadInvites();
    loadUsers();
  }

  if (token) showPanel();
</script>
</body>
</html>
