<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e1621"><title>Регистрация — Nevogram</title><link rel="stylesheet" href="/style.css"></head>
<body><div class="auth-screen"><div class="auth-card">
<div class="auth-logo">✈️</div><h1>Nevogram</h1><p class="auth-sub">Регистрация по бета-приглашению</p>
<form id="registerForm">
<input id="inviteCode" type="text" placeholder="Бета-код приглашения" autocomplete="off" required>
<input id="registerUsername" type="text" placeholder="Логин (3–24 символа)" autocomplete="username" pattern="[a-zA-Z0-9_]{3,24}" required>
<input id="registerPassword" type="password" placeholder="Пароль (минимум 8 символов)" autocomplete="new-password" minlength="8" maxlength="72" required>
<input id="registerPassword2" type="password" placeholder="Повторите пароль" autocomplete="new-password" minlength="8" maxlength="72" required>
<button type="submit">Зарегистрироваться</button></form>
<div id="registerError" class="auth-error"></div>
<p class="register-hint">Уже есть аккаунт? <a href="/">Войти</a></p>
</div></div>
<script>
const form=document.getElementById('registerForm'),err=document.getElementById('registerError');
form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';
const password=document.getElementById('registerPassword').value;
if(password!==document.getElementById('registerPassword2').value){err.textContent='Пароли не совпадают';return;}
try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({inviteCode:document.getElementById('inviteCode').value.trim(),username:document.getElementById('registerUsername').value.trim(),password})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка регистрации');if(d.token){let accounts=[];try{accounts=JSON.parse(localStorage.getItem('nevogramAccounts')||'[]')}catch(_){}if(!Array.isArray(accounts))accounts=[];const current=localStorage.getItem('token');if(current){try{const payload=JSON.parse(atob(current.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));if(payload.userId&&!accounts.some(a=>a.token===current))accounts.unshift({id:payload.userId,token:current,username:'Сохранённый аккаунт',name:'Сохранённый аккаунт'})}catch(_){}}localStorage.setItem('nevogramAccounts',JSON.stringify(accounts.slice(0,2)));localStorage.setItem('token',d.token)}location.href='/cp';}catch(e){err.textContent=e.message;}});
</script></body></html>
