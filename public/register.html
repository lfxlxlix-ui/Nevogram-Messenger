<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0e1621"><title>Регистрация — Nevogram</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="auth-screen"><div class="auth-card">
<div class="auth-logo">✈️</div><h1>Nevogram</h1><p class="auth-sub">Создание аккаунта по приглашению</p>
<form id="registerForm"><div id="registerFields">
<input id="inviteCode" type="text" placeholder="Код приглашения" autocomplete="off" required>
<input id="registerEmail" type="email" placeholder="Почта" autocomplete="email" required>
<button type="submit">Зарегистрироваться</button>
</div><div id="registerCodeStep" class="hidden">
<p class="auth-sub">Аккаунт создан. Введите 6-значный код из письма на <strong id="registerEmailLabel"></strong></p>
<input id="registerOtp" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="Код из 6 цифр" autocomplete="one-time-code">
<button type="button" id="registerVerify">Войти в Nevogram</button>
</div></form>
<div id="registerError" class="auth-error"></div>
<p class="register-hint">Уже есть аккаунт? <a href="/">Войти</a></p>
</div></div>
<script>
const form=document.getElementById('registerForm');
const err=document.getElementById('registerError');
let email='';
async function request(path,body){const r=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Ошибка запроса');return d;}
form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';email=document.getElementById('registerEmail').value.trim().toLowerCase();try{await request('/register',{email,inviteCode:document.getElementById('inviteCode').value.trim()});document.getElementById('registerFields').classList.add('hidden');document.getElementById('registerCodeStep').classList.remove('hidden');document.getElementById('registerEmailLabel').textContent=email;}catch(e){err.textContent=e.message;}});
document.getElementById('registerVerify').addEventListener('click',async()=>{err.textContent='';try{const d=await request('/auth/verify-code',{email,code:document.getElementById('registerOtp').value.trim()});localStorage.setItem('token',d.token);location.href='/';}catch(e){err.textContent=e.message;}});
</script></body></html>
