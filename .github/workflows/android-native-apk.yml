name: Build Nevogram Native Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-native/**"
      - ".github/workflows/android-native-apk.yml"

permissions:
  contents: read

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build native debug APK
        working-directory: android-native
        run: gradle assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nevogram-Native-Android-APK
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
